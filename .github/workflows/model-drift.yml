name: Model drift

# The committed audit fixtures are DERIVED from AWS's own service models, and
# nothing noticed when the source moved.
#
# `dzaudit` is a developer tool run by hand; what CI checks is its committed
# output. So an operation AWS adds, a constraint it tightens, or a response
# member it marks required lands in the models and changes nothing here until
# somebody happens to regenerate. The per-service `modelOperations` lists are
# pinned by an exact count and would fail — but only once someone ran the tool.
#
# This runs it. Weekly, and on demand: refetch the models, regenerate
# everything derived from them, and fail if the result differs from what is
# committed. A red build here is not a bug in doze-aws; it is AWS having
# changed, which is a thing worth being told rather than discovering.

on:
  schedule:
    - cron: '23 5 * * 1' # weekly, Monday 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Refetch the models and regenerate every derived fixture
        env:
          GOWORK: off
        run: |
          set -euo pipefail
          # The service directory and the model file do not always share a
          # name (stepfunctions/sfn, logs/cloudwatch-logs), so the pairs are
          # written out rather than inferred.
          pairs="
          apigateway:api-gateway
          apigateway:apigatewayv2
          cloudformation:cloudformation
          cloudwatch:cloudwatch
          dynamodb:dynamodb
          eventbridge:eventbridge
          iam:iam
          kinesis:kinesis
          kms:kms
          lambda:lambda
          logs:cloudwatch-logs
          s3:s3
          secretsmanager:secrets-manager
          sns:sns
          sqs:sqs
          ssm:ssm
          stepfunctions:sfn
          sts:sts
          "
          for pair in $pairs; do
            dir="${pair%%:*}"; model="${pair##*:}"
            # Fetches into .audit-models on a miss, which is what CI always is.
            go run ./cmd/dzaudit shapes "$model" > "$dir/testdata/shapes_$model.json"
            go run ./cmd/dzaudit ops "$model" > "$dir/testdata/ops_$model.json"
          done

      - name: Fail if anything derived has moved
        run: |
          if ! git diff --quiet -- '*/testdata/shapes_*.json' '*/testdata/ops_*.json'; then
            echo 'AWS has changed a service model since these fixtures were generated.'
            echo
            git --no-pager diff --stat -- '*/testdata/shapes_*.json' '*/testdata/ops_*.json'
            echo
            echo 'Regenerate locally and review the diff:'
            echo '  go run ./cmd/dzaudit shapes <model> > <service>/testdata/shapes_<model>.json'
            echo '  go run ./cmd/dzaudit ops    <model> > <service>/testdata/ops_<model>.json'
            echo
            echo 'An ops_*.json diff means AWS ADDED OR REMOVED AN OPERATION. The per-service'
            echo 'coverage test will then name it as unaccounted for, which is the point:'
            echo 'it answers a generic InvalidAction until it is handled or refused by name.'
            echo
            echo 'Reviewing it is the point — these are the spec doze-aws is measured'
            echo 'against, so a change to them should be seen rather than absorbed.'
            exit 1
          fi
          echo 'No drift: the committed shapes and operation lists still match the published models.'

      - name: Upload the regenerated fixtures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-shapes
          path: |
            */testdata/shapes_*.json
            */testdata/ops_*.json
          retention-days: 14
