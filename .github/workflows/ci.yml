name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: deadcode
        run: go tool task deadcode

  test:
    strategy:
      fail-fast: false
      matrix:
        # Both OSes: file-store fsync/rename behavior differs.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The interpreters the embedded Lambda runtime clients run on. Tests
      # that need one skip when it is absent, so a leg without them still
      # passes — but then the shims are not being tested, which is why every
      # leg installs all three.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Unit tests
        run: go test -short ./...
      # Deliberately its own step, without -race and without -short. The race
      # detector inflates heap and resident memory several-fold, so footprint
      # ceilings measured under it would be measuring the detector; -short
      # skips the parts that have to boot something. This is the one place the
      # budget gets a clean process to measure in.
      - name: Lightness budget
        run: go test -run 'TestLightness|TestEmbedded|TestEachService|TestOnlyTheDeclaredModules' -count=1 -v .
      - name: Full suite (race)
        run: go test -race ./...
        # CI keeps running the full race suite on every push and pull request.
        # `task check` is the fast local stage; this is the one that gates a
        # merge, so splitting the local gate cost nothing here.
