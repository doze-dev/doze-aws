# doze-aws configuration. Copy to ./doze-aws.toml (auto-loaded) or point at it
# with --config. Every key here maps 1:1 to a command-line flag, and flags win
# over the file. Print your effective configuration with:
#
#   doze-aws config print

# This instance's name in .doze. It answers on aws.<name>.doze, and the
# AWS-shaped hostnames sit beneath that — sqs.<region>.aws.<name>.doze. Two
# projects on one machine each get their own name and never contend.
# Unset means the directory this file is in.
# name = "harbour"

# ALSO serve on an address instead of a name, for the cases a name cannot
# reach: a sibling container over a compose network, CI, a machine where
# dns-setup has not run. This REPLACES the name rather than adding to it —
# no .doze name is claimed, and URLs come back in their path form.
# listen = "127.0.0.1:4566"

# Root data directory; each region owns a subdirectory, with IAM and STS under
# _global (data/ap-south-1/sqs, data/_global/iam, ...).
#
# A RELATIVE path is resolved against THIS FILE, not against the directory you
# happen to run from — so the pair travels together. An absolute path is used
# as given, which is how you point at a mounted volume with more disk. The
# --data-dir flag is the exception: typed in a shell, resolved from there.
data-dir = "data"

# Services to enable. Omit to enable everything this build implements.
# services = ["sts"]

# CloudFormation/SAM template applied at boot (docs/cloudformation.md). Omit to
# auto-detect ./template.yaml.
# template = "template.yaml"

# IAM enforcement: "soft" (the default — evaluate and record, never denies),
# "off" (no evaluation at all), or "enforce" (real AccessDenied responses).
# iam-mode = "soft"

[lambda]
# How long a warm function keeps its process(es) before scaling to zero.
# idle-timeout = "10m"
# Function output (stdout and stderr of the function processes) is echoed
# to this log as `lambda[<name>] <line>` and kept by the logs service; quiet
# stops the echo only.
# quiet = false
# Where each runtime family's interpreter is, when it is not the one on
# PATH (python3, node, ruby, java, dotnet). Python, Node and Ruby functions run
# through doze-aws's embedded runtime clients on that interpreter; nothing
# else needs installing.
# [lambda.runtimes]
# python = "/opt/homebrew/bin/python3.12"
# nodejs = "/Users/me/.nvm/versions/node/v20.11.0/bin/node"
