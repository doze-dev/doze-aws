            <circle cx="40" cy="15" r="4"></circle>
            <path d="M40 19 L40 27"></path>
            <path d="M40 27 L48 35 L40 43 L32 35 Z"></path>
            <path d="M32 35 L22 35 L22 47"></path>
            <path d="M48 35 L58 35 L58 47"></path>
            <rect x="14" y="47" width="16" height="10" rx="2"></rect>
            <rect x="50" y="47" width="16" height="10" rx="2"></rect>
            <path d="M22 57 L22 63 L40 63"></path>
            <path d="M58 57 L58 63 L40 63"></path>
            <path d="M40 63 L40 66"></path>
        </g>
        <circle cx="40" cy="68" r="3.5" fill="#FFFFFF"></circle>
    </g>
</svg>
