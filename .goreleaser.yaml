# GoReleaser configuration — https://goreleaser.com
# Runs in CI on a `v*` tag (see .github/workflows/release.yml). Produces static,
# cross-platform binaries plus a checksums file; install.sh downloads and
# verifies these. Test the config locally with:
#   goreleaser release --snapshot --clean
version: 2

project_name: doze-aws

# No before: hooks. `go mod tidy` used to run here, which means the tree that
# gets built is not the tree CI tested: tidy can add, drop or reorder a
# requirement, and a release is the one build where that must not happen.
# CI runs tidy checks on every push instead.

builds:
  - id: doze-aws
    main: ./cmd/doze-aws
    binary: doze-aws
    env:
      - CGO_ENABLED=0 # pure Go: fully static, no libc dependency.
    # Linux and macOS only. Windows was in this list and could not build: the
    # .doze zone comes from doze-names, which locks its registry with
    # syscall.Flock and manages the hosts file through Unix-only paths, so
    # `GOOS=windows go build ./cmd/doze-aws` fails to compile. v0.3.0 shipped
    # Windows binaries because doze-names was not a dependency yet; it joined
    # a month later and nothing has been released since, so the breakage was
    # never seen. GoReleaser builds every matrix entry, so the next tag would
    # have failed the whole release rather than just the Windows asset.
    #
    # Supporting Windows means porting doze-names' registry locking and
    # resolver setup, which is a project rather than a build flag. Until then
    # saying so beats shipping a target that does not exist.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      # Reproducible, and 57,344 bytes smaller: without it the absolute build
      # path of the CI runner is baked into every binary that ships.
      #
      # It also makes this artifact the same SIZE as the one
      # binarysize_test.go measures, so the budget gates what people download
      # rather than something near it. Not the same BYTES: this build stamps
      # vcs.revision and vcs.time (the test passes -buildvcs=false), and
      # carries the real tag where the test pins v0.0.0 so its number does not
      # move with the version string. Measured: both are 22,622,368 bytes and
      # they differ from byte 265.
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    # Matches what install.sh expects: doze-aws_<version>_<os>_<arch>.<ext>
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - doze-aws.example.toml

checksum:
  name_template: checksums.txt
  algorithm: sha256

# The notes are hand-written in CHANGELOG.md, and release.yml passes the
# section for the tag with --release-notes, which replaces the generated
# changelog outright.
#
# NOT `disable: true`, which is what v1.0.0 shipped with and why its body was
# empty. Disabling skips the changelog step entirely, and --release-notes
# overrides that step's output — so together they cancel: GoReleaser accepted
# the flag without complaint, published five assets, and set no body at all.
# One of the two, and the flag is the one that puts words there.
#
# The filters below apply only if someone releases WITHOUT the flag, which the
# workflow never does. They are the reason the flag exists: they assume
# Conventional Commits, and of the 341 commits between v0.3.0 and 1.0.0 they
# match 7 — the generated notes would have been 334 sentences in commit order.
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

release:
  draft: false
  prerelease: auto
  name_template: "doze-aws {{ .Version }}"
